services:
  backend:
    build:
      context: ./nirvaha-backend
      dockerfile: Dockerfile
    container_name: nirvaha-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://host.docker.internal:5432/nirvaha_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NIRVAHA_ALLOWED_ORIGINS: ${NIRVAHA_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
      NIRVAHA_EVIDENCE_STORAGE_PATH: /app/uploads/evidence
    volumes:
      - ./data/evidence:/app/uploads/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./nirvaha-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: nirvaha-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
