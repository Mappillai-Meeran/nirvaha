# Production Profile Configuration (Hardened)

# Database Configuration (Mandatory environment variables in production, no dev fallbacks)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# JPA / Hibernate Safety
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Security & Secrets
nirvaha.jwt.secret=${JWT_SECRET}
nirvaha.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
nirvaha.allowed-origins=${NIRVAHA_ALLOWED_ORIGINS}

# Evidence & Rate Limits
nirvaha.max-evidence-size=${NIRVAHA_MAX_EVIDENCE_SIZE:10485760}
nirvaha.rate-limit=${NIRVAHA_RATE_LIMIT:60}
nirvaha.rate-limit-window=${NIRVAHA_RATE_LIMIT_WINDOW:60}
nirvaha.evidence-storage-path=${NIRVAHA_EVIDENCE_STORAGE_PATH:uploads/evidence}

# Health Check & Actuator Safety
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging
logging.level.root=INFO
logging.level.com.nirvaha=INFO
