spring.application.name=nirvaha-backend
spring.profiles.default=dev

# Server & Graceful Shutdown
server.port=${PORT:8080}
server.shutdown=graceful

# Multipart Upload Limits (10MB max matching Phase 11C)
spring.servlet.multipart.max-file-size=${NIRVAHA_MAX_EVIDENCE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${NIRVAHA_MAX_EVIDENCE_SIZE:10MB}

# Import local unversioned environment overrides if present
spring.config.import=optional:classpath:application-local.properties,optional:file:application-local.properties,optional:file:.env[.properties],optional:file:../.env[.properties]

# Default Database Settings (overridden in dev/prod profiles if needed)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nirvaha_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# Default Application Properties
nirvaha.jwt.secret=${JWT_SECRET:nirvahaSecretKeyForLocalDevelopmentDoNotUseInProductionSuperSecretKey12345!}
nirvaha.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
nirvaha.allowed-origins=${NIRVAHA_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
nirvaha.max-evidence-size=10485760
nirvaha.rate-limit=${NIRVAHA_RATE_LIMIT:60}
nirvaha.rate-limit-window=${NIRVAHA_RATE_LIMIT_WINDOW:60}
nirvaha.evidence-storage-path=${NIRVAHA_EVIDENCE_STORAGE_PATH:uploads/evidence}

# Actuator configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# External Data Integrations
nirvaha.imd.api-key=${NIRVAHA_IMD_API_KEY:}
nirvaha.imd.api-url=${NIRVAHA_IMD_API_URL:https://api.imd.gov.in/api/v1}
nirvaha.weather.open-meteo.base-url=${NIRVAHA_OPEN_METEO_BASE_URL:https://api.open-meteo.com/v1/forecast}

# SLA Tracking & Escalation Engine (6-hour evaluation cycle)
nirvaha.sla.evaluation-enabled=${NIRVAHA_SLA_EVALUATION_ENABLED:true}
nirvaha.sla.evaluation-interval-ms=${NIRVAHA_SLA_EVALUATION_INTERVAL_MS:21600000}
nirvaha.sla.initial-delay-ms=${NIRVAHA_SLA_INITIAL_DELAY_MS:30000}