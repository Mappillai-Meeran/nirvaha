# =========================================================================
# NIRVAHA ISOLATED TEST DATASOURCE CONFIGURATION (DEV PROFILE)
# Ensure tests running with @ActiveProfiles("dev") target isolated test database
# =========================================================================
spring.datasource.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/nirvaha_test_db}
spring.datasource.username=${TEST_DATABASE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${TEST_DATABASE_PASSWORD:${DATABASE_PASSWORD:postgres}}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
