# =========================================================================
# NIRVAHA ISOLATED TEST DATASOURCE CONFIGURATION
# Tests MUST NEVER connect to or modify the development database (nirvaha_db).
# =========================================================================

# Database Configuration (Dedicated Isolated Test Database)
spring.datasource.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/nirvaha_test_db}
spring.datasource.username=${TEST_DATABASE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${TEST_DATABASE_PASSWORD:${DATABASE_PASSWORD:postgres}}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migration Configuration for Test Database
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# JPA / Hibernate Safety for Tests
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Import local unversioned environment overrides if present (e.g. for local PostgreSQL password)
spring.config.import=optional:classpath:application-local.properties,optional:file:application-local.properties,optional:file:.env[.properties],optional:file:../.env[.properties]

# Test Isolation Properties
nirvaha.evidence-storage-path=target/test-uploads
nirvaha.jwt.secret=${JWT_SECRET:nirvahaSecretKeyForLocalDevelopmentDoNotUseInProductionSuperSecretKey12345!}
nirvaha.jwt.expiration-ms=86400000
nirvaha.allowed-origins=http://localhost:5173,http://localhost:3000
nirvaha.rate-limit=60
nirvaha.rate-limit-window=60
